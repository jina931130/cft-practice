<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CJ CFT 연습실 심화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#EDF0F4; --sheet:#FFFFFF; --ink:#1C2230; --muted:#5E6779; --rule:#DCE1E8;
  --omr:#C8413B; --omr-soft:#FBEDEC; --navy:#233056; --navy-ink:#FFFFFF;
  --ok:#2F7A55; --warn:#A85A12; --bar:#233056; --bar-bg:#E4E8EF;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#12161E; --sheet:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B5; --rule:#2C3342;
    --omr:#E2716A; --omr-soft:#2A1F22; --navy:#4A5E9C; --navy-ink:#FFFFFF;
    --ok:#5DBB8C; --warn:#E0A25E; --bar:#8FA2D8; --bar-bg:#262C39; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#12161E; --sheet:#1A1F29; --ink:#E6E9EF; --muted:#9AA3B5; --rule:#2C3342;
  --omr:#E2716A; --omr-soft:#2A1F22; --navy:#4A5E9C; --navy-ink:#FFFFFF;
  --ok:#5DBB8C; --warn:#E0A25E; --bar:#8FA2D8; --bar-bg:#262C39; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}

/* intro */
.hero{padding:40px 32px 32px}
.hero h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-0.02em}
.hero .lead{margin-top:12px;max-width:34em;color:var(--muted);font-size:17px}
.omr-strip{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.omr-strip span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--omr);color:var(--omr);display:grid;place-items:center;font-size:12px;font-weight:600}
.omr-strip span.fill{animation:fill .35s ease forwards}
@keyframes fill{to{background:var(--ink);border-color:var(--ink);color:var(--sheet)}}
@media (prefers-reduced-motion: reduce){.omr-strip span.fill{animation:none;background:var(--ink);border-color:var(--ink);color:var(--sheet)}}
.block{margin-top:16px;padding:28px 32px}
.block h2{font-size:20px;font-weight:700;margin-bottom:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:18px;cursor:pointer}
.mode[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.mode strong{display:block;font-size:17px}
.mode span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.rules p+p{margin-top:10px}
.rules{color:var(--ink);max-width:40em}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{appearance:none;border:0;border-radius:6px;padding:13px 22px;font-size:16px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--navy-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.btn:focus-visible,.mode:focus-visible,.bub:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist-wrap{overflow-x:auto}
table.hist th,table.hist td{text-align:left;padding:8px 10px;border-top:1px solid var(--rule);white-space:nowrap}
table.hist th{color:var(--muted);font-weight:500;border-top:0}

/* test bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.bar-in{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.bar-part{font-weight:700}
.bar-sub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.timer{margin-left:auto;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--omr)}
.quit{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 8px;border-radius:4px}
.quit.armed{color:var(--omr);font-weight:600}
.prog{height:3px;background:var(--bar-bg)}
.prog i{display:block;height:100%;background:var(--omr);transition:width .2s}

/* part 1 */
.page{margin-top:20px;overflow:hidden}
.scale-head,.q{display:grid;grid-template-columns:44px 1fr 226px;align-items:center;gap:12px;padding:14px 18px}
.scale-head{padding-top:12px;padding-bottom:10px;background:var(--omr-soft)}
.scale-head .labels{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:11px;line-height:1.3;color:var(--omr);font-weight:600}
.q{border-top:1px solid var(--rule)}
.q.cur{box-shadow:inset 3px 0 0 var(--omr)}
.num{color:var(--omr);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.qtext{font-size:16px}
.bubs{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center}
.bub{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--omr);background:transparent;color:var(--omr);font-weight:600;font-size:13px;cursor:pointer;padding:0;transition:background .12s,color .12s}
.bub[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.pagefoot{display:flex;align-items:center;gap:12px;padding:16px 18px;border-top:1px solid var(--rule)}
.pagefoot .hint{color:var(--muted);font-size:14px;margin-right:auto}
.kbd{display:inline-block;border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-size:12px;line-height:20px}

/* part 2 */
.set-head,.opt{display:grid;grid-template-columns:1fr 72px 72px;align-items:center;gap:12px;padding:14px 18px}
.set-head{background:var(--omr-soft);color:var(--omr);font-size:13px;font-weight:600}
.set-head span{text-align:center}
.opt{border-top:1px solid var(--rule)}
.opt .bubcell{display:flex;justify-content:center}

/* guide */
.guide{padding:32px}
.guide h2{font-size:24px}
.guide .facts{display:flex;gap:28px;margin:20px 0;flex-wrap:wrap}
.guide .facts div{font-variant-numeric:tabular-nums}
.guide .facts b{display:block;font-size:28px;font-weight:600}
.guide .facts span{color:var(--muted);font-size:14px}

/* results */
.res-head{padding:32px}
.res-head h1{font-size:30px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule)}
.summary div{padding:18px 20px;border-left:1px solid var(--rule)}
.summary div:first-child{border-left:0}
.summary b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.summary span{color:var(--muted);font-size:13px}
.good{color:var(--ok)} .caution{color:var(--warn)} .bad{color:var(--omr)}
.findings p{padding:12px 0;border-top:1px solid var(--rule)}
.findings p:first-child{border-top:0;padding-top:0}
.group{margin-top:18px}
.group:first-of-type{margin-top:0}
.group h3{font-size:16px}
.group .gdesc{color:var(--muted);font-size:14px;margin:2px 0 10px}
.trow{display:grid;grid-template-columns:110px 1fr 40px 46px;gap:12px;align-items:center;padding:6px 0;font-size:15px}
.track{height:10px;background:var(--bar-bg);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--bar);border-radius:5px}
.tscore{font-variant-numeric:tabular-nums;text-align:right}
.net{font-variant-numeric:tabular-nums;text-align:right;font-size:13px;color:var(--muted)}
.net.pos{color:var(--ok)} .net.neg{color:var(--omr)}
.legend{color:var(--muted);font-size:13px;margin-top:12px}
.pair{padding:14px 0;border-top:1px solid var(--rule)}
.pair:first-child{border-top:0}
.pair .pl{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:15px}
.pair .pl+.pl{margin-top:4px}
.pair .ans{color:var(--muted);white-space:nowrap}
.pair .tag{font-size:12px;color:var(--muted)}
.dist{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;align-items:center;font-size:14px;padding:4px 0}
.dist .tscore{color:var(--muted)}
.prio{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.prio ol{margin:8px 0 0;padding-left:20px}
.note{font-size:13px;color:var(--muted);margin-top:24px;max-width:40em}

@media (max-width:640px){
  .wrap{padding:16px 10px 48px}
  .hero,.block,.guide,.res-head{padding:24px 18px}
  .modes{grid-template-columns:1fr}
  .scale-head{grid-template-columns:1fr;padding:10px 14px}
  .scale-head .sp{display:none}
  .q{grid-template-columns:36px 1fr;padding:14px}
  .q .bubs{grid-column:1/-1}
  .set-head,.opt{grid-template-columns:1fr 56px 56px;padding:12px 14px}
  .summary{grid-template-columns:1fr 1fr}
  .summary div:nth-child(3){border-left:0}
  .summary div:nth-child(n+3){border-top:1px solid var(--rule)}
  .trow{grid-template-columns:88px 1fr 34px 40px;gap:8px;font-size:14px}
  .prio{grid-template-columns:1fr}
  .timer{font-size:22px}
  .bar-in{gap:10px}
}
:root{--ok-bg:rgba(47,122,85,.14);--warn-bg:rgba(168,90,18,.14);--omr-bg:rgba(200,65,59,.13)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok-bg:rgba(93,187,140,.16);--warn-bg:rgba(224,162,94,.16);--omr-bg:rgba(226,113,106,.16)}}
:root[data-theme="dark"]{--ok-bg:rgba(93,187,140,.16);--warn-bg:rgba(224,162,94,.16);--omr-bg:rgba(226,113,106,.16)}
/* v2 report */
.rep-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:8px;align-items:center;padding:28px 28px 20px}
.hex svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.hex .ring{fill:none;stroke:var(--rule);stroke-width:1}
.hex .spoke{stroke:var(--rule);stroke-width:1}
.hex .target{fill:none;stroke:var(--omr);stroke-width:1.5;stroke-dasharray:5 4}
.hex .me{fill:var(--bar);fill-opacity:.2;stroke:var(--bar);stroke-width:2.2;transform-box:view-box;transform-origin:180px 174px;animation:grow .9s cubic-bezier(.2,.8,.2,1)}
.hex .dot{fill:var(--bar)}
.hex .lab{font:600 13px var(--font);fill:var(--ink)}
.hex .val{font:500 12px var(--font);fill:var(--muted)}
.hex .val.low{fill:var(--omr)}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.hex .me{animation:none}}
.legend-row{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:6px}
.legend-row i{display:inline-block;width:18px;height:0;border-top:2px solid var(--bar);vertical-align:middle;margin-right:6px}
.legend-row i.t{border-top:2px dashed var(--omr)}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.v-good{background:var(--ok-bg);color:var(--ok)}
.v-mid{background:var(--warn-bg);color:var(--warn)}
.v-bad{background:var(--omr-bg);color:var(--omr)}
.fit-num{font-size:56px;font-weight:700;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.fit-num small{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px}
.fit-sum{color:var(--muted);font-size:15px;max-width:30em}
.meters{margin-top:20px;display:grid;gap:12px}
.meter{display:grid;grid-template-columns:100px 1fr 72px;gap:10px;align-items:center;font-size:14px}
.meter>span:first-child{white-space:nowrap}
.meter .mt{position:relative;height:8px;background:var(--bar-bg);border-radius:4px}
.meter .mt i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.meter .mt b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.55}
.meter .mv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.axis-table{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.axis-table div{padding:14px 18px;border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.axis-table div:nth-child(3n+1){border-left:0}
.axis-table div:nth-child(-n+3){border-top:0}
.axis-table b{font-size:15px}
.axis-table .sub{display:block;font-size:12px;color:var(--muted)}
.axis-table .sc{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.axis-table .gap{font-size:13px;font-weight:500;margin-left:6px}
.sec-lead{color:var(--muted);font-size:14px;margin:-6px 0 16px;max-width:40em}
.imp{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--rule)}
.imp:first-of-type{border-top:0;padding-top:4px}
.imp .rank{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.sev3 .rank{background:var(--omr)} .sev2 .rank{background:var(--warn)} .sev1 .rank{background:var(--muted)}
.imp h3{font-size:16px;margin-bottom:4px}
.imp .data{font-size:13px;color:var(--muted);margin-bottom:8px}
.imp .row{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;margin-top:4px}
.imp .row span:first-child{color:var(--muted);font-weight:600}
.minor{margin-top:10px;font-size:14px;color:var(--muted)}
.minor li{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{padding:6px 10px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid transparent}
.chip small{font-weight:500;margin-left:6px;opacity:.8}
.c-good{background:var(--ok-bg);color:var(--ok)}
.c-mid{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--omr-bg);color:var(--omr)}
.c-none{background:var(--bar-bg);color:var(--muted)}
.pcard{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin-top:10px}
.pcard .st{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px;padding:3px 0}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bar-bg);white-space:nowrap;align-self:start;line-height:1.6}
.rev{font-size:11px;color:var(--omr);font-weight:600;margin-left:6px}
.gapline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.gapline svg{width:100%;height:28px}
.gapline .gl-t{stroke:var(--rule);stroke-width:2}
.gapline .gl-b{stroke:var(--omr);stroke-width:4;stroke-linecap:round;opacity:.45}
.gapline .gl-a{fill:var(--bar)} .gapline .gl-c{fill:var(--omr)}
.gapline .gl-n{font:500 10px var(--font);fill:var(--muted)}
.gapline .gd{color:var(--omr);font-weight:700;white-space:nowrap}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{border:1px solid var(--rule);border-radius:8px;padding:16px}
.tcard h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tq{font-size:14px;margin:10px 0 12px}
.tq b{color:var(--muted);font-weight:600;display:block;font-size:12px;margin-bottom:2px}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale5 span{display:grid;place-items:center;height:30px;border-radius:4px;font-size:12px;font-weight:600;background:var(--bar-bg);color:var(--muted);position:relative}
.scale5 span.safe{background:var(--ok-bg);color:var(--ok)}
.scale5 span.amb{background:var(--warn-bg);color:var(--warn)}
.counts5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px;font-size:11px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.counts5 .hitc{color:var(--omr);font-weight:700}
.scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.ttip{font-size:13px;margin-top:12px}
.tex{font-size:13px;color:var(--muted);margin-top:6px}
.tcard details{margin-top:10px;font-size:13px}
.tcard summary{cursor:pointer;color:var(--navy);font-weight:600}
:root[data-theme="dark"] .tcard summary{color:var(--bar)}
.tcard details li{margin-top:6px}
.tcard details li em{font-style:normal;color:var(--omr);font-weight:600;margin-left:4px}
.div-row{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.div-bar{position:relative;height:12px}
.div-bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--rule)}
.div-bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.div-bar i.pos{left:50%;background:var(--ok)} .div-bar i.neg{right:50%;background:var(--omr)}
.div-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.speed svg{width:100%;height:auto;display:block}
.speed .sb{fill:var(--bar)} .speed .sb.fast{fill:var(--omr)}
.speed .tl{stroke:var(--ok);stroke-dasharray:4 3;stroke-width:1.5}
.speed .ax{font:500 10px var(--font);fill:var(--muted)}
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;font-size:12px;font-weight:600}
.stack span{display:grid;place-items:center;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack-leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}
.stack-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details.more summary{cursor:pointer;font-weight:700;font-size:20px;list-style:none}
details.more summary::after{content:" +";color:var(--muted)}
details.more[open] summary::after{content:" −"}
@media (max-width:720px){
  .rep-hero{grid-template-columns:1fr;padding:22px 16px}
  .tgrid{grid-template-columns:1fr}
  .axis-table{grid-template-columns:repeat(2,1fr)}
  .axis-table div{border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
  .axis-table div:nth-child(odd){border-left:0}
  .axis-table div:nth-child(-n+2){border-top:0}
  .meter{grid-template-columns:92px 1fr 64px;font-size:13px}
  .div-row{grid-template-columns:80px 1fr 30px}
}
:root{--hl:rgba(255,196,0,.42)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hl:rgba(255,196,0,.28)}}
:root[data-theme="dark"]{--hl:rgba(255,196,0,.28)}
mark.kp{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;font-weight:600;padding:0 1px}
.gentoggle{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;cursor:pointer}
.gentoggle input{margin-top:4px;width:18px;height:18px;accent-color:var(--navy)}
.preplist{margin:20px 0 12px;display:grid;gap:8px}
.prow2{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-size:15px}
.pst{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bar-bg);color:var(--muted)}
.pst.done{background:var(--ok-bg);color:var(--ok)} .pst.fail{background:var(--omr-bg);color:var(--omr)} .pst.run{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.sub-h{font-weight:700;font-size:15px;margin:6px 0 12px}
.sc-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.sc-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule)}
.sc-legend i.me{background:var(--ink);border-color:var(--ink)} .sc-legend i.off{background:var(--omr);border-color:var(--omr)} .sc-legend i.z{background:var(--ok-bg);border-color:var(--ok)}
.pcard{border:1px solid var(--rule);border-radius:8px;padding:16px;margin-top:12px}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pcard .pd{font-size:13px;font-weight:700;color:var(--omr);background:var(--omr-bg);padding:3px 10px;border-radius:999px}
.prow{display:grid;grid-template-columns:52px 1fr;gap:6px 12px;align-items:start}
.prow .ptag{font-size:12px;font-weight:700;color:var(--muted);padding-top:3px}
.prow .ptext{font-size:15px;margin:0}
.prow .sc5{grid-column:2}
.sc5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.sc5 span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;border-radius:5px;background:var(--bar-bg);color:var(--muted);border:1.5px solid transparent;min-width:0}
.sc5 span b{font-size:14px;line-height:1.2}
.sc5 span small{font-size:10px;line-height:1.2;white-space:nowrap}
.sc5 span.z{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.sc5 span.me{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sc5 span.off{background:var(--omr);color:#fff;border-color:var(--omr)}
.rel{margin:12px 0 12px 64px;font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;background:var(--bar-bg);color:var(--ink)}
.rel.opp{border-left:3px solid var(--warn)} .rel.same{border-left:3px solid var(--bar)}
.pexp{font-size:14px;margin:12px 0 0;padding-top:12px;border-top:1px dashed var(--rule)}
.pexp.cj{border-top:0;padding-top:0;margin-top:6px;color:var(--muted)}
.okc{color:var(--ok)} .badc{color:var(--omr)}
@media (max-width:640px){
  .prow{grid-template-columns:1fr}.prow .sc5{grid-column:1}.rel{margin-left:0}
  .sc5 span small{font-size:9px;white-space:normal;text-align:center}
}
.hits{display:grid;gap:10px;margin-top:10px}
.hit2{border-left:3px solid var(--omr);background:var(--omr-bg);border-radius:0 6px 6px 0;padding:10px 12px}
.hit2.amb{border-left-color:var(--warn);background:var(--warn-bg)}
.hit2 p{margin:0}
.hit2 .hs{font-size:14px;font-weight:600;color:var(--ink)}
.hit2 .ha{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin-top:6px}
.hit2 .mine{font-weight:700;color:var(--omr)} .hit2.amb .mine{color:var(--warn)}
.hit2 .rec{font-weight:700;color:var(--ok)} .hit2 .arrow{color:var(--muted)}
.hit2 .vtag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);margin-left:6px;padding:1px 6px;border-radius:4px;background:var(--bar-bg)}
.hit2 .hw{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.55}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.howto>div{border:1px solid var(--rule);border-radius:8px;padding:12px}
.howto p{font-size:13px;margin-top:8px;line-height:1.6}
.sc-type{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.t-pos{background:var(--ok-bg);color:var(--ok)} .t-neg{background:var(--warn-bg);color:var(--warn)} .t-trap{background:var(--omr-bg);color:var(--omr)}
.pp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.pp-sum>div{background:var(--bar-bg);border-radius:8px;padding:12px}
.pp-sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.pp-sum span{font-size:12px;color:var(--muted)}
.sc-card{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-top:10px}
.sc-card.bad{border-left:4px solid var(--omr)} .sc-card.mid{border-left:4px solid var(--warn)}
.sc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.sc-row{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.pick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.pick.m{background:var(--navy);color:#fff} .pick.l{background:var(--omr);color:#fff} .pick.e{border:1.5px dashed var(--rule)}
.itag{font-size:11px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:4px}
.itag.trap{background:var(--omr-bg);color:var(--omr)} .itag.hon{background:var(--warn-bg);color:var(--warn)}
.sc-note{font-size:13px;margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--rule);line-height:1.6}
.mism{margin:0;padding-left:18px;font-size:14px} .mism li{margin-top:6px}
.pp-list{display:grid;gap:4px}
.pp-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.pp-dots{display:flex;gap:3px;flex-wrap:wrap}
.pp-dots i{width:10px;height:10px;border-radius:50%}
.pp-dots i.m{background:var(--navy)} .pp-dots i.l{background:var(--omr)}
:root[data-theme="dark"] .pp-dots i.m,:root[data-theme="dark"] .pick.m{background:var(--bar)}
.all-sets summary{cursor:pointer;font-weight:600;margin-top:18px;color:var(--muted)}
@media (max-width:720px){.howto,.pp-sum{grid-template-columns:1fr}}
summary{display:block;list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::marker{content:''}
.tcard summary::before,.all-sets summary::before{content:'▸ ';}
.tcard details[open] summary::before,.all-sets[open] summary::before{content:'▾ ';}
</style>

<script>

  EXE:['실행력','O'],CHG:['도전·변화','O'],CRE:['창의','O'],LEA:['주도성','O'],
  CON:['성실·책임','T'],PLN:['계획·분석','T'],GRO:['학습·성장','T'],EMO:['정서 안정','T'],
  COL:['협업·존중','S'],CUS:['고객 공감','S'],HON:['정직·원칙','S'],COM:['소통','S'],GLO:['개방성','S']

  {k:'T',n:'인재',d:'맡은 일을 끝까지 해내고 스스로 성장하는 힘'},
  {k:'S',n:'상생',d:'동료, 고객, 다른 생각과 함께 가는 힘'}
];
/* ---------- 문항 풀 v3: 구체적인 행동·상황 중심 ---------- */
// "#쌍ID " = 같은 성향을 다른 상황으로 묻는 짝, "~" = 반대 방향
const BANK={
EXE:["#E1 할 일이 생기면 메모해 두기보다 [[바로 처리하는]] 편이다.","#E1 메시지나 메일은 [[확인하는 즉시 답하는]] 편이다.","#E2 ~마음먹은 운동이나 공부를 [[실제로 시작하기까지 오래 걸린다]].","#E2 새해 계획은 [[1월이 가기 전에 이미 시작해 둔다]].","#E3 회의가 끝나면 내가 맡은 일부터 [[바로 손댄다]].","#E3 ~회의에서 정한 일을 [[며칠 묵혀 둘 때가 많다]].","~여행 계획을 세우다가 지쳐서 정작 출발을 미룬 적이 있다.","마감이 없는 일도 스스로 기한을 정해서 끝낸다.","~해야 할 일 앞에서 책상 정리부터 하게 된다.","막힌 문제는 혼자 붙잡기보다 바로 물어봐서 푼다.","같은 시간이면 완벽한 하나보다 괜찮은 셋을 만드는 쪽을 택한다.","주말 계획이 틀어지면 바로 다른 계획을 세운다.","~생각이 많아서 행동이 늦다는 말을 듣는다.","결과물을 일찍 보여 주고 피드백을 받는 편이다."],
CHG:["#C1 가 본 적 없는 동네 식당에 [[혼자 들어가는 것이 어렵지 않다]].","#C1 ~여행지에서도 [[늘 먹던 메뉴를 고르는]] 편이다.","#C2 익숙한 업무보다 [[처음 해 보는 업무를 맡을 때 의욕이 난다]].","#C2 ~새 업무를 맡으면 [[잘 해낼 수 있을지 걱정부터 앞선다]].","#C3 ~쓰던 앱의 화면이 바뀌면 [[한동안 불편해서 짜증이 난다]].","#C3 새로운 서비스나 기기가 나오면 [[먼저 써 보는]] 편이다.","실패할 확률이 높아도 배울 게 많은 프로젝트를 고르겠다.","~이사나 이직처럼 큰 변화는 최대한 미루고 싶다.","남들이 해 보지 않은 방식을 시도할 때 재미를 느낀다.","~확실하지 않은 일에는 손을 대지 않는 편이다.","조직 개편이나 팀 이동이 있으면 기대가 먼저 된다.","~규칙이 자주 바뀌는 곳에서는 일하기 어렵다.","지금 하는 일과 전혀 다른 분야를 배워 보고 싶을 때가 많다.","목표를 세울 때는 지금 실력보다 조금 높게 잡는다."],
CRE:["#R1 같은 길로 다니기보다 [[가끔 일부러 다른 길로 가 본다]].","#R1 ~일을 할 때는 [[검증된 방식을 그대로 따르는 것이 편하다]].","#R2 [[전혀 상관없어 보이는 두 가지를 엮어]] 아이디어를 낸 적이 많다.","#R2 다른 분야 사례를 보다가 [[내 일에 쓸 방법을 떠올리곤 한다]].","#R3 ~회의에서 아이디어를 내라고 하면 [[머릿속이 하얘진다]].","#R3 브레인스토밍 시간에 [[아이디어를 여러 개 내는]] 편이다.","불편한 물건을 보면 어떻게 바꾸면 좋을지 상상해 본다.","~정답이 정해져 있는 문제가 마음이 편하다.","떠오른 아이디어를 메모 앱에 따로 모아 둔다.","설명서보다 직접 이것저것 눌러 보며 익힌다.","~광고나 포스터를 봐도 별다른 생각이 들지 않는다.","남들이 당연하게 여기는 규칙에 왜 그런지 묻곤 한다.","생각을 그림이나 도식으로 정리하는 것을 좋아한다.","~새로운 아이디어를 내기보다 있는 것을 다듬는 일이 더 맞는다."],
LEA:["#D1 조별 과제에서 [[역할을 나누는 일을 주로 맡았다]].","#D1 여러 사람이 모이면 [[자연스럽게 내가 일정을 정리하게 된다]].","#D2 ~책임자를 정해야 할 때 [[먼저 손을 들지는 않는다]].","#D2 맡을 사람이 없으면 [[내가 나서서 맡는다]].","#D3 의견이 갈리면 [[기준을 세워서 결론을 내자고 제안한다]].","#D3 ~의견이 갈리면 [[결론이 날 때까지 지켜보는]] 편이다.","팀원이 처져 있으면 분위기를 끌어올릴 방법을 찾는다.","~발표처럼 앞에 서는 역할은 다른 사람에게 넘기는 편이다.","새로운 프로젝트를 먼저 제안해 본 적이 있다.","~윗사람이 방향을 정해 주는 것이 편하다.","결과가 좋지 않아도 내가 내린 결정이면 책임을 피하지 않는다.","다른 사람을 설득해서 생각을 바꾸게 한 경험이 많다.","~주어진 역할 이상은 신경 쓰지 않는다.","동아리나 모임에서 운영진을 맡아 본 적이 있다."],
CON:["#S1 약속 장소에는 [[보통 10분 먼저 도착한다]].","#S1 ~약속 시간에 [[아슬아슬하게 도착하는 일이 잦다]].","#S2 맡은 일이 끝나도 [[한 번 더 확인하고 제출한다]].","#S2 ~제출하고 나서 [[오타나 실수를 발견하는 일이 많다]].","#S3 손해를 보더라도 [[한 번 한 약속은 지킨다]].","#S3 ~상황이 바뀌면 [[약속을 미루는 것도 괜찮다]]고 생각한다.","매일 비슷한 시간에 일어나는 생활 습관이 있다.","~재미없는 일은 끝까지 하기 어렵다.","빌린 물건은 받은 상태 그대로 돌려준다.","~일정표나 가계부를 쓰다 말다 하는 편이다.","아무도 확인하지 않는 일도 대충 하지 않는다.","누가 묻기 전에 맡은 일의 진행 상황을 먼저 공유한다.","~마감에 쫓겨 밤을 새운 적이 많다.","한번 시작한 강의나 책은 끝까지 마치는 편이다."],
PLN:["#P1 여행 전에 [[동선과 예산을 미리 정리한다]].","#P1 ~큰 일을 앞두고도 [[계획 없이 그때그때 처리하는]] 편이다.","#P2 결정하기 전에 [[장단점을 표로 정리해 본다]].","#P2 물건을 살 때 [[리뷰와 가격을 여러 곳에서 비교한다]].","#P3 ~[[숫자나 표가 많은 자료는 읽기 싫어진다]].","#P3 [[숫자로 정리된 자료를 보면]] 상황이 더 잘 이해된다.","문제가 생기면 원인을 몇 단계로 나눠서 따져 본다.","~할 일 목록을 만들어도 잘 보지 않는다.","일정이 몰릴 것 같으면 미리 순서를 바꿔 둔다.","'아마', '대충'보다 정확한 숫자로 말하려고 한다.","~감으로 결정하고 이유는 나중에 붙이는 편이다.","보고서를 쓸 때 목차부터 잡고 시작한다.","관심 있는 기업의 실적 발표나 업계 동향 자료를 찾아 읽는다.","~받은 파일을 바탕화면에 그대로 쌓아 두는 편이다."],
GRO:["#G1 업무와 관련된 [[책이나 강의를 따로 챙겨 본다]].","#G1 퇴근 후나 주말에 [[배우고 있는 것이 하나 이상 있다]].","#G2 피드백을 받으면 [[메모해 두고 다음 작업에 반영한다]].","#G2 ~[[같은 지적을 두 번 이상 받은 적이 많다]].","#G3 ~[[지금 하는 일만 잘하면 충분하다]]고 생각한다.","#G3 1년 뒤의 내 모습을 그리며 [[따로 준비하는 것이 있다]].","모르는 단어나 개념이 나오면 바로 찾아본다.","잘하는 사람의 작업물을 따라 만들어 보며 배운다.","~새로운 프로그램을 익히는 데 시간이 많이 걸린다.","일이 끝나면 잘된 점과 아쉬운 점을 따로 적어 둔다.","~어려운 내용은 필요할 때 배우면 된다고 생각한다.","세미나나 강연에 일부러 찾아가 본 적이 있다.","자격증이나 시험처럼 목표를 정해 꾸준히 공부한 경험이 있다.","~지적을 들으면 의욕이 크게 꺾인다."],
EMO:["#M1 발표 직전에도 [[크게 떨리지 않는다]].","#M1 ~중요한 자리를 앞두면 [[잠을 설친다]].","#M2 싫은 소리를 들어도 [[하루가 지나면 대부분 잊는다]].","#M2 ~누군가에게 싫은 소리를 들으면 [[며칠 동안 머릿속을 맴돈다]].","#M3 일이 꼬여도 [[일단 할 수 있는 것부터 한다]].","#M3 ~일이 계획대로 안 되면 [[손에 잡히지 않는다]].","~기분이 자주 오르내린다는 말을 듣는다.","힘든 날에도 다음 날이면 기분이 회복된다.","~작은 실수 하나에 하루 종일 마음이 쓰인다.","스트레스를 받으면 푸는 나만의 방법이 있다.","~기다리는 연락이 안 오면 다른 일에 집중하기 어렵다.","급한 일이 한꺼번에 몰려도 순서를 정하면 차분해진다.","~남들이 나를 어떻게 볼지 신경이 많이 쓰인다.","예상치 못한 질문을 받아도 침착하게 답하는 편이다."],
COL:["#L1 팀 과제에서 내 몫이 끝나도 [[다른 사람 일을 도와준다]].","#L1 ~[[내 몫만 확실히 하면]] 나머지는 각자 책임이라고 생각한다.","#L2 나와 의견이 다른 사람에게 [[이유부터 물어본다]].","#L2 ~회의에서 반대 의견이 나오면 [[기분이 상한다]].","#L3 후배나 신입의 아이디어도 좋으면 [[그대로 받아들인다]].","#L3 ~경력이 짧은 사람의 의견은 [[한 번 더 의심하게 된다]].","함께 만든 결과물을 발표할 때 팀원 이름을 꼭 언급한다.","~혼자 하면 더 빨리 끝날 일을 나눠서 하는 게 답답하다.","동료가 실수하면 탓하기보다 같이 수습한다.","다른 부서 사람과도 편하게 협업하는 편이다.","~내 방식대로 해야 마음이 놓인다.","팀원마다 일하는 속도가 다르다는 걸 감안해서 일정을 잡는다.","갈등이 생기면 양쪽 이야기를 다 들어 보는 편이다.","~동료의 피드백에 방어적으로 반응할 때가 있다."],
CUS:["#U1 카페나 가게에 가면 [[손님이 불편해할 만한 점이 먼저 눈에 띈다]].","#U1 앱을 쓰다가 불편한 점이 있으면 [[왜 그런지 따져 보게 된다]].","#U2 친구가 고민을 말하면 [[해결책보다 이야기를 먼저 들어 준다]].","#U2 ~상대의 표정이 바뀌어도 [[잘 눈치채지 못한다]].","#U3 불만 글을 보면 [[무엇을 고치면 될지 생각한다]].","#U3 ~불만을 말하는 사람은 [[대체로 까다로운 사람]]이라고 생각한다.","선물을 고를 때 받는 사람의 생활을 먼저 떠올린다.","상품 리뷰에서 별점보다 구체적인 불만 내용을 먼저 읽는다.","~내가 쓰기 편하면 다른 사람도 편할 거라고 생각한다.","부모님이 새 기기를 쓰는 걸 보면 어디서 막히는지 보인다.","~사람들이 무엇을 좋아하는지는 크게 궁금하지 않다.","줄이 길게 늘어선 곳을 보면 어떻게 줄일 수 있을지 생각한다.","같은 물건도 쓰는 사람에 따라 다르게 느낄 수 있다고 생각한다.","~같은 설명을 여러 번 해야 하는 사람을 보면 답답하다."],
HON:["#H1 거스름돈을 더 받은 걸 알면 [[돌아가서 돌려준다]].","#H1 ~[[내게 유리한 실수는 굳이 바로잡지 않아도]] 된다고 생각한다.","#H2 실수를 하면 [[누가 알아채기 전에 먼저 말한다]].","#H2 ~작은 실수는 [[조용히 고치고 넘어가는]] 편이다.","#H3 잘 모르는 내용은 [[모른다고 말한다]].","#H3 ~모르는 내용이 나와도 [[아는 척 넘어갈 때가 있다]].","보는 사람이 없어도 줄을 서고 신호를 지킨다.","~결과가 좋으면 과정의 작은 편법은 넘어갈 수 있다.","불리한 내용도 숨기지 않고 보고한다.","~분위기가 좋을 땐 내 생각과 다른 말에도 맞장구친다.","동료의 부정행위를 알게 되면 모른 척하지 않는다.","~성과를 말할 때 조금 부풀려 표현하는 편이다.","회사 비품이나 공용 물건은 사적으로 쓰지 않는다.","윗사람의 지시가 잘못됐다고 생각하면 이유를 들어 말한다."],
COM:["#O1 처음 보는 사람에게 [[먼저 말을 거는]] 편이다.","#O1 ~새로운 모임에 가면 [[누가 말을 걸어 줄 때까지 기다린다]].","#O2 복잡한 내용을 [[예를 들어 쉽게 설명하는]] 편이다.","#O2 ~내가 설명하면 [[다시 묻는 사람이 많다]].","#O3 불편한 이야기도 [[미루지 않고 그날 꺼낸다]].","#O3 ~하고 싶은 말이 있어도 [[분위기를 보다가 넘어갈 때가 많다]].","결론부터 말하고 이유를 덧붙이는 편이다.","메신저로 길게 주고받기보다 직접 이야기하는 게 빠르다고 생각한다.","~사람이 많은 자리에 다녀오면 혼자 쉬는 시간이 꼭 필요하다.","상대에 따라 말투와 설명 수준을 바꾼다.","~회의 시간에 거의 말하지 않고 끝날 때가 있다.","글로 생각을 정리해서 공유하는 것이 편하다.","대화 중에 상대가 이해했는지 중간중간 확인한다.","~가벼운 대화를 길게 이어 가는 게 어렵다."],
GLO:["#B1 [[나와 생각이 전혀 다른 사람과]] 이야기하는 것이 흥미롭다.","#B1 ~[[나와 가치관이 다른 사람과는]] 깊이 대화하고 싶지 않다.","#B2 세대가 다른 사람의 의견에서도 [[배울 점을 찾는다]].","#B2 ~윗세대나 아랫세대의 생각은 [[이해하기 어렵다고 느낀다]].","#B3 내 생각이 틀렸다는 근거를 보면 [[쉽게 생각을 바꾼다]].","#B3 ~한번 굳어진 생각은 [[잘 바뀌지 않는다]].","낯선 분야의 책도 가리지 않고 읽는다.","~익숙한 사람들과만 어울리는 편이다.","처음 보는 음식이나 문화도 거리낌 없이 시도한다.","~관심 없는 주제의 이야기는 끝까지 듣기 어렵다.","다른 사람의 취향을 있는 그대로 존중하는 편이다.","~유행하는 것들은 대부분 의미 없다고 생각한다.","다양한 배경의 사람이 모인 팀이 더 좋은 결과를 낸다고 믿는다.","~나와 다른 방식으로 일하는 사람을 보면 답답하다."]

function bankTraits(){
  const out={};
  for(const t in BANK){
    const items=BANK[t].map(raw=>{const m=raw.match(/^(?:#(\w+)\s)?(~)?(.+)$/);return {k:'TR',t,p:m[1]||null,r:!!m[2],s:m[3]};});
    const pairs={};items.filter(i=>i.p).forEach(i=>(pairs[i.p]=pairs[i.p]||[]).push(i));
    out[t]={pairs:Object.values(pairs),singles:items.filter(i=>!i.p)};
  }
  return out;
}
const BANKPOOL={
  INT:()=>INT.map(([t,s])=>({k:'INT',t,r:false,s})),

  ABI:()=>ABI.map(([s,lo,hi])=>({k:'ABI',s,safe:[lo,hi]})),

function withIds(arr){return arr.map(o=>Object.assign({id:UID++},o));}
function spreadPairs(arr,gap){
  for(let round=0;round<25;round++){
    let moved=false;const pos={};
    arr.forEach((it,i)=>{if(it.p)(pos[it.p]=pos[it.p]||[]).push(i);});
    for(const k in pos){const [i,j]=pos[k];if(j==null)continue;
      if(Math.abs(i-j)<gap){const c=[];arr.forEach((it,x)=>{if(!it.p&&Math.abs(x-i)>=gap)c.push(x);});
        if(c.length){const x=c[Math.floor(Math.random()*c.length)];[arr[j],arr[x]]=[arr[x],arr[j]];moved=true;}}}
    if(!moved)break;
  }
  return arr;
}
function buildP1(mode,gen,seen){
  const bt=bankTraits(),mix=MIX[mode];const items=[];let gp=0,genUsed=0;
  for(const t in TR){
    const g=(gen&&gen.traits[t])||{pairs:[],singles:[]};
    const gpairs=shuffle(g.pairs).slice(0,mix.pairs);
    gpairs.forEach(([f,b])=>{const pid='g'+(gp++);items.push({k:'TR',t,p:pid,r:false,s:f.s,gen:1},{k:'TR',t,p:pid,r:true,s:b.s,gen:1});genUsed+=2;});
    sampleFresh(bt[t].pairs.map(p=>({p,s:p[0].s})),mix.pairs-gpairs.length,seen).forEach(x=>items.push(...x.p.map(i=>Object.assign({},i))));
    const gs=shuffle(g.singles).slice(0,mix.singles).map(x=>Object.assign({gen:1},x));genUsed+=gs.length;
    items.push(...gs,...sampleFresh(bt[t].singles,mix.singles-gs.length,seen));
  }
  for(const k in BANKPOOL){
    if(!mix[k])continue;
    const gl=((gen&&gen[k])||[]).map(x=>Object.assign({gen:1},x));const take=shuffle(gl).slice(0,mix[k]);genUsed+=take.length;
    items.push(...take,...sampleFresh(BANKPOOL[k](),mix[k]-take.length,seen));
  }
  S.genUsed=genUsed;
  return spreadPairs(shuffle(withIds(items)),CFG[mode].gap);
}
function buildP2(mode,gen,seen){
  const [nb,nn,nt]=CFG[mode].p2;let id=0;const used=new Set();const traits=Object.keys(TR);
  const posOf=t=>[...((gen&&gen.P2POS[t])||[]).map(s=>({s,g:1})),...P2POS[t].map(s=>({s,g:0}))];
  const negOf=t=>[...((gen&&gen.P2NEG[t])||[]).map(s=>({s,g:1})),...P2NEG[t].map(s=>({s,g:0}))];
  const avail=(fn,t)=>fn(t).filter(x=>!used.has(x.s));
  const pick=(fn,t)=>{const a=avail(fn,t);const gg=a.filter(x=>x.g),fresh=a.filter(x=>!x.g&&!seen.has(x.s));const c=gg.length?gg:(fresh.length?fresh:(a.length?a:fn(t)));const x=c[Math.floor(Math.random()*c.length)];used.add(x.s);if(x.g)S.genUsed++;return x.s;};
  const pickTraits=(fn,n)=>traits.map(t=>[t,avail(fn,t).length+Math.random()]).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0]);
  const sets=[];
  for(let i=0;i<nb;i++){const ts=pickTraits(posOf,3);sets.push({id:id++,type:'pos',items:ts.map(t=>({t,s:pick(posOf,t)}))});}
  for(let i=0;i<nn;i++){const ts=pickTraits(negOf,3);sets.push({id:id++,type:'neg',items:ts.map(t=>({t,s:pick(negOf,t)}))});}
  const trapList=[];const seenT=new Set();
  [...shuffle((gen&&gen.P2TRAP)||[]),...shuffle(P2TRAP.filter(x=>!seen.has(x[0]))),...shuffle(P2TRAP)].forEach(x=>{if(!seenT.has(x[0])){seenT.add(x[0]);trapList.push(x);}});
  trapList.slice(0,nt).forEach(([s,tag])=>{const ts=pickTraits(posOf,2);sets.push({id:id++,type:'trap',items:shuffle([...ts.map(t=>({t,s:pick(posOf,t)})),{t:'VAL',s,tag}])});});
  return shuffle(sets);
}

let SAMPLE=null,SAMPLESTATE='pending';

const SEEDS=['아르바이트','동아리','조별 과제','회사 회의','가족 모임','운동','이사','장보기','대중교통','요리','친구와의 약속','온라인 쇼핑','시험 공부','봉사활동','팀 프로젝트 마감','신입 교육','회식','택배·배달','병원 예약','여행 준비','중고 거래','집안일','반려동물','스마트폰 앱','모임 총무','면접 준비','인턴','고객 응대','보고서 작성','이메일'];
const TRAIT_DESC={EXE:'실행력(바로 행동하고 끝까지 밀어붙임)',CHG:'도전·변화(새로운 것과 변화를 반김)',CRE:'창의(다르게 생각하고 아이디어를 냄)',LEA:'주도성(앞에서 방향을 잡고 책임짐)',CON:'성실·책임(약속, 마감, 꼼꼼함)',PLN:'계획·분석(미리 계획하고 근거로 판단)',GRO:'학습·성장(스스로 배우고 피드백을 반영)',EMO:'정서 안정(압박과 비판에 흔들리지 않음)',COL:'협업·존중(동료를 돕고 다른 의견을 존중)',CUS:'고객 공감(사용자와 상대 입장을 헤아림)',HON:'정직·원칙(손해를 봐도 사실대로, 원칙대로)',COM:'소통(먼저 말하고 쉽게 전달)',GLO:'개방성(다른 생각과 낯선 것을 받아들임)'};
function styleGuide(seeds,avoid){

규칙:
- 계열사나 직무에 치우치지 마. 해외, 외국어, 협력사, 화장품, 특정 회사 이름은 쓰지 마. 누구나 겪는 일상, 학교, 아르바이트, 동아리, 직장 상황을 고르게 써.
- 문장은 '나는'을 뺀 1인칭 평서문, 14~40자. 어미를 섞어: '~편이다', '~때가 많다', '~한 적이 있다', '~라고 생각한다', '~하는 것이 좋다', '~게 된다'.
- 추상적인 덕목 대신 구체적인 행동, 습관, 상황을 묘사해. 교과서 같은 문장, 정답이 뻔히 보이는 문장, 이중부정, 서로 뜻이 겹치는 문장은 피해.
- 이번 회차 상황 키워드(골고루 섞어 써): ${seeds.join(', ')}.
${avoid.length?`- 아래 문장들과 겹치거나 비슷하면 안 돼:\n${avoid.map(s=>'  · '+s).join('\n')}`:''}`;
}
function promptTraits(codes,seeds,avoid){
  return styleGuide(seeds,avoid)+`

만들 것: 아래 성향마다 짝 문항 2쌍과 단독 문항 3개.
${codes.map(c=>`- ${c}: ${TRAIT_DESC[c]}`).join('\n')}
짝 문항: 같은 성향을 서로 다른 상황으로 묻는 두 문장. 한 문장은 성향이 높은 쪽(dir "+"), 다른 문장은 성향이 낮은 쪽(dir "-")으로 써. 두 문장에서 성향을 드러내는 핵심 구절을 [[ ]]로 감싸. 예: "회의가 끝나면 내가 맡은 일부터 [[바로 손댄다]]." / "회의에서 정한 일을 [[며칠 묵혀 둘 때가 많다]]."
단독 문항: [[ ]] 없이, dir은 "+" 또는 "-"를 섞어.
JSON으로만 답해: {"items":[{"t":"EXE","pair":1,"dir":"+","s":"..."},{"t":"EXE","pair":1,"dir":"-","s":"..."},{"t":"EXE","pair":2,...},{"t":"EXE","pair":0,"dir":"-","s":"..."}]}`;
}
function promptTraps(seeds,avoid){
  return styleGuide(seeds,avoid)+`

만들 것: 함정 문항. 응시자가 빨리 읽으면 무심코 좋은 쪽으로 답하게 되는 문장들이야.
- VAL 12개: 현실적이고 일 잘하는 사람의 말처럼 들리지만 정직, 존중, 상생(함께 성장), ONLYONE(최고·최초·차별화를 향한 도전) 중 하나와 부딪히는 생각. tag는 그 가치 이름, why는 왜 함정인지 응시자에게 설명하는 해요체 한두 문장(60자 안팎).
- ABS 8개: 좋은 말에 '전혀', '한 번도', '언제나', '단 한 번도' 같은 절대 표현이 붙어 사실상 아무도 해당하지 않는 문장.
- HUM 8개: 사람이라면 누구나 한 번쯤 겪는 사소한 약점이나 감정(예: 가끔 일을 미루고 싶다). 아니라고 답하면 과장이 되는 문장.
- MAL 8개: 피해의식, 충동성, 공격성, 지나친 불안, 냉소를 묻는 적응 척도 문장.
- TWO 8개: 한쪽으로 보면 장점, 다른 쪽으로 보면 단점인 문장. good과 bad에 각각 짧게. 그렇다로 답할 때 단점이 더 크게 읽히면 risk를 "high", 양쪽이 비슷하면 "both".
- IND 10개: 다른 사람이 나를 어떻게 보는지 묻는 문장. 따뜻하게 들려도 사실은 나쁜 평판인 것(dir "-")과 좋은 평판(dir "+")을 섞어. t는 관련 성향 코드(EXE,CHG,CRE,LEA,CON,PLN,GRO,EMO,COL,CUS,HON,COM,GLO).
- ABI 5개: 관계 구도나 상대 의도를 읽는 능력을 묻는 문장. 사람을 이용하는 뉘앙스가 강하면 hi를 3, 아니면 4로.
JSON으로만 답해: {"VAL":[{"s":"...","tag":"정직","why":"..."}],"ABS":["..."],"HUM":["..."],"MAL":["..."],"TWO":[{"s":"...","good":"...","bad":"...","risk":"both"}],"IND":[{"t":"CON","dir":"-","s":"..."}],"ABI":[{"s":"...","hi":4}]}`;
}
function promptP2(seeds,avoid){
  return styleGuide(seeds,avoid)+`

만들 것: Part 2(세 문장 중 가장 가까운 것과 먼 것 고르기)에 쓸 짧은 문장. 10~24자, '~한다', '~편이다'처럼 짧게.
- POS: 아래 성향마다 2개씩. 서로 비슷하게 바람직하게 들려서 고르기 어려워야 해.
- NEG: 성향마다 1개씩. 누구나 있을 법한 가벼운 약점.
- TRAP 6개: 세트 안에 섞였을 때 그럴듯하게 들리지만 정직, 존중, 상생, ONLYONE과 부딪히는 문장. tag 포함.
성향: ${Object.keys(TRAIT_DESC).map(c=>`${c}=${TRAIT_DESC[c]}`).join(', ')}
JSON으로만 답해: {"POS":{"EXE":["...","..."],...},"NEG":{"EXE":["..."],...},"TRAP":[{"s":"...","tag":"존중"}]}`;
}
function okText(s,min,max){return typeof s==='string'&&s.length>=min&&s.length<=max&&/[가-힣]/.test(s)&&!BANNED.test(s);}
const TAGS=['정직','존중','상생','ONLYONE'];
function cleanTraits(j,codes){
  const out={};codes.forEach(c=>out[c]={pairs:[],singles:[]});
  const items=(j&&Array.isArray(j.items))?j.items:[];
  const byPair={};
  items.forEach(x=>{if(!x||!codes.includes(x.t)||!okText(x.s,8,70))return;const s=esc(x.s.trim());const r=x.dir==='-';
    if(x.pair>0){if(!/\[\[.+?\]\]/.test(s))return;const k=x.t+'|'+x.pair;(byPair[k]=byPair[k]||[]).push({t:x.t,r,s});}
    else out[x.t].singles.push({k:'TR',t:x.t,r,s:plain(s)});});
  for(const k in byPair){const ps=byPair[k];const f=ps.find(p=>!p.r),b=ps.find(p=>p.r);if(f&&b){out[f.t].pairs.push([f,b]);}}
  return out;
}
function cleanTraps(j){
  const o={VAL:[],ABS:[],HUM:[],MAL:[],TWO:[],INDN:[],INDP:[],ABI:[]};if(!j)return o;
  (j.VAL||[]).forEach(x=>{if(x&&okText(x.s,8,70)&&TAGS.includes(x.tag))o.VAL.push({k:'VAL',s:esc(x.s),tag:x.tag,why:typeof x.why==='string'?esc(x.why.slice(0,140)):''});});
  ['ABS','HUM','MAL'].forEach(k=>(j[k]||[]).forEach(s=>{if(okText(s,8,70))o[k].push({k,s:esc(s)});}));
  (j.TWO||[]).forEach(x=>{if(x&&okText(x.s,8,70))o.TWO.push({k:'TWO',s:esc(x.s),good:esc(x.good||''),bad:esc(x.bad||''),safe:x.risk==='high'?[1,3]:[2,4]});});
  (j.IND||[]).forEach(x=>{if(x&&TR[x.t]&&okText(x.s,8,70)){if(x.dir==='-')o.INDN.push({k:'IND',t:x.t,r:true,s:esc(x.s)});else o.INDP.push({k:'INDP',t:x.t,r:false,s:esc(x.s)});}});
  (j.ABI||[]).forEach(x=>{if(x&&okText(x.s,8,70))o.ABI.push({k:'ABI',s:esc(x.s),safe:[1,x.hi===3?3:4]});});
  return o;
}
function cleanP2(j){
  const o={POS:{},NEG:{},TRAP:[]};if(!j)return o;
  for(const t in TR){o.POS[t]=((j.POS||{})[t]||[]).filter(s=>okText(s,6,40)).map(esc);o.NEG[t]=((j.NEG||{})[t]||[]).filter(s=>okText(s,6,40)).map(esc);}
  (j.TRAP||[]).forEach(x=>{if(x&&okText(x.s,6,40)&&TAGS.includes(x.tag))o.TRAP.push([esc(x.s),x.tag]);});
  return o;
}
async function generateItems(){
  const seen=[...loadSeen()].slice(0,60);
  const seeds=sample(SEEDS,8);
  const codes=Object.keys(TR);const g1=codes.slice(0,7),g2=codes.slice(7);
  const jobs=[
    {key:'t1',label:'성향 문항 1',run:()=>SAMPLE.json(promptTraits(g1,seeds,seen),{modelTier:'default',cache:false,signal:S.genCtl.signal}),clean:j=>cleanTraits(j,g1)},
    {key:'t2',label:'성향 문항 2',run:()=>SAMPLE.json(promptTraits(g2,seeds,seen),{modelTier:'default',cache:false,signal:S.genCtl.signal}),clean:j=>cleanTraits(j,g2)},
    {key:'tr',label:'함정 문항',run:()=>SAMPLE.json(promptTraps(seeds,seen),{modelTier:'default',cache:false,signal:S.genCtl.signal}),clean:cleanTraps},
    {key:'p2',label:'Part 2 문장',run:()=>SAMPLE.json(promptP2(seeds,seen),{modelTier:'default',cache:false,signal:S.genCtl.signal}),clean:cleanP2}
  ];
  S.genStatus={};jobs.forEach(jb=>S.genStatus[jb.key]={label:jb.label,state:'run',n:0});
  const results={};
  await Promise.all(jobs.map(async jb=>{
    try{const j=await jb.run();const c=jb.clean(j);results[jb.key]=c;S.genStatus[jb.key].state='done';S.genStatus[jb.key].n=countGen(jb.key,c);}
    catch(e){S.genStatus[jb.key].state=(e&&e.code==='cancelled')?'skip':'fail';S.genStatus[jb.key].code=e&&e.code;}
    if(S.phase==='prep')renderPrep();
  }));
  const gen={traits:{},VAL:[],ABS:[],HUM:[],MAL:[],TWO:[],INDN:[],INDP:[],ABI:[],P2POS:{},P2NEG:{},P2TRAP:[]};
  for(const t in TR)gen.traits[t]={pairs:[],singles:[]};
  ['t1','t2'].forEach(k=>{const r=results[k];if(r)for(const t in r){gen.traits[t]=r[t];}});
  if(results.tr)for(const k in results.tr)gen[k]=results.tr[k];
  if(results.p2){gen.P2POS=results.p2.POS;gen.P2NEG=results.p2.NEG;gen.P2TRAP=results.p2.TRAP;}
  return gen;
}
function countGen(key,c){
  if(key==='t1'||key==='t2')return Object.values(c).reduce((s,x)=>s+x.pairs.length*2+x.singles.length,0);
  if(key==='tr')return Object.values(c).reduce((s,x)=>s+x.length,0);
  return Object.values(c.POS).reduce((s,x)=>s+x.length,0)+Object.values(c.NEG).reduce((s,x)=>s+x.length,0)+c.TRAP.length;
}

function startPrep(){

function animateStrip(){

    </div>
    
    <div class="actions"><button class="btn" data-act="start">연습 시작하기</button></div>
  </section>
  <section class="sheet block rules">
    <h2>이번 버전에 들어 있는 것</h2>
    <p>문항은 실제 인성검사처럼 구체적인 행동, 생활 습관, 일에 대한 가치관을 묻는 문장 위주예요. 특정 직무나 계열사에 치우치지 않은 CJ 공통 인재상 기준이에요.</p><p>문장 400여 개 중에서 매번 다르게 뽑고, 이전에 풀었던 문장은 뒤로 미뤄요. 그래서 풀 때마다 다른 시험지가 나와요.</p><p>사이사이에 함정 문장이 섞여 있어요. 가치 함정, 절대 표현, 누구나 겪는 일, 적응 척도, 두 얼굴 문장, 돌려 묻는 문장, 능력과 가치 사이에 걸친 문장, 이렇게 일곱 가지예요.</p>
    <p>같은 성향을 묻는 짝 문항은 40문항 이상 떨어뜨려 놨어요. 기억이 아니라 기준으로 답해야 일관성이 나와요.</p>

/* ---------- 분석 ---------- */
function trapStatus(it,v){
  const [lo,hi]=it.safe||TYPES[it.k].safe;
  if(v>=lo&&v<=hi)return 'ok';
  if(it.k==='VAL'&&v===3)return 'amb';

  return 'hit';
}
function analyze(){
  const adj=it=>{const v=S.a1[it.id];return v==null?null:(it.r?6-v:v);};
  const sc={};for(const t in TR)sc[t]={sum:0,n:0};
  const pairs={},dist=[0,0,0,0,0],order=[];
  const traps={};TYPE_ORDER.forEach(k=>traps[k]={n:0,hits:[],amb:[],counts:[0,0,0,0,0]});
  S.p1.forEach(it=>{
    const v=S.a1[it.id];if(v!=null){dist[v-1]++;order.push(v);}
    if(traps[it.k]&&v!=null){const g=traps[it.k];g.n++;g.counts[v-1]++;const st=trapStatus(it,v);if(st==='hit')g.hits.push(it);else if(st==='amb')g.amb.push(it);}
    if(it.t&&TR[it.t]){const a=adj(it);if(a!=null){sc[it.t].sum+=a;sc[it.t].n++;}}
    if(it.p)(pairs[it.p]=pairs[it.p]||[]).push(it);
  });
  const score={};for(const t in sc)score[t]=sc[t].n?Math.round((sc[t].sum/sc[t].n-1)/4*100):null;
  const pd=[];for(const k in pairs){const ps=pairs[k];if(ps.length===2){const a=adj(ps[0]),b=adj(ps[1]);if(a!=null&&b!=null)pd.push({k,d:Math.abs(a-b),a,b,items:ps,t:ps[0].t});}}
  const avgD=pd.length?pd.reduce((s,x)=>s+x.d,0)/pd.length:0;
  const cons=Math.round(100*(1-avgD/4));
  const shaky=pd.filter(x=>x.d>=2).sort((a,b)=>b.d-a.d);
  const tcons={};for(const t in TR){const xs=pd.filter(x=>x.t===t);tcons[t]=xs.length?xs.reduce((s,x)=>s+x.d,0)/xs.length:null;}
  const answered=order.length;
  let streak=0,maxStreak=0,prev=null;order.forEach(v=>{streak=(v===prev)?streak+1:1;prev=v;if(streak>maxStreak)maxStreak=streak;});
  // 신뢰도
  const oc=traps.ABS.hits.length+traps.HUM.hits.length,ocN=traps.ABS.n+traps.HUM.n,ocR=ocN?oc/ocN:0;
  let lie,lieCls;if(ocR<=0.1){lie='좋아요';lieCls='good';}else if(ocR<=0.25){lie='조금 과해요';lieCls='mid';}else{lie='과장으로 보여요';lieCls='bad';}
  // Part 2
  const net={},app={};for(const t in TR){net[t]=0;app[t]=0;}
  let p2un=0;const negHon=[],trapPick=[],trapAvoid=[];
  S.p2.forEach(set=>{set.items.forEach(it=>{if(TR[it.t])app[it.t]++;});const a=S.a2[set.id];if(!a||a.m==null||a.l==null){p2un++;return;}
    const m=set.items[a.m],l=set.items[a.l];
    if(set.type==='neg'){net[m.t]--;net[l.t]++;if(m.t==='HON')negHon.push(m);}
    else{ if(m.t==='VAL')trapPick.push(m);else net[m.t]++; if(l.t==='VAL')trapAvoid.push(l);else net[l.t]--; }
  });
  // 가치 함정 종합
  const vh=traps.VAL.hits.length+trapPick.length,va=traps.VAL.amb.length;
  let val,valCls;if(vh===0&&va<=2){val='좋아요';valCls='good';}else if(vh<=2){val='조심';valCls='mid';}else{val='위험';valCls='bad';}
  // 선명도
  const vals=Object.values(score).filter(x=>x!=null);const spread=vals.length?Math.max(...vals)-Math.min(...vals):0;
  const strong=answered?dist[4]/answered:0;
  let sharp,sharpCls;if(spread>=25&&strong>=0.08){sharp='잘 보여요';sharpCls='good';}else if(spread>=15){sharp='보통';sharpCls='mid';}else{sharp='안 보여요';sharpCls='bad';}
  // 6축
  const axes=AXES.map(ax=>{
    const ts=ax.traits.map(t=>score[t]).filter(x=>x!=null);let base=ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:0;
    const p2=clamp(ax.traits.reduce((s,t)=>s+net[t],0)*2,-10,10);
    let pen=0;
    if(ax.tag){pen+=traps.VAL.hits.filter(i=>i.tag===ax.tag).length*6+traps.VAL.amb.filter(i=>i.tag===ax.tag).length*2+trapPick.filter(i=>i.tag===ax.tag).length*5;}
    if(ax.k==='HON')pen+=negHon.length*4;
    if(ax.k==='DUT')pen+=traps.MAL.hits.length*4;
    const v=Math.round(clamp(base+p2-pen,0,100));
    return Object.assign({},ax,{v,base:Math.round(base),p2,pen});
  });
  // 핏 점수
  let fit=axes.reduce((s,a)=>s+Math.min(a.v/a.target,1),0)/axes.length*100;
  if(lieCls==='bad')fit-=10;else if(lieCls==='mid')fit-=4;
  if(cons<85)fit-=(85-cons)*0.5;
  fit-=Math.min(vh*3,15);
  fit=Math.round(clamp(fit,0,100));
  const honAx=axes.find(a=>a.k==='HON');const below=axes.filter(a=>a.v<a.target);const belowTxt=below.map(a=>a.n).join(', ');
  let verdict,vCls,vSum;
  if(honAx.v<60||vh>=3||lieCls==='bad'){verdict='걸러질 수 있어요';vCls='bad';vSum='정직이나 가치관을 묻는 문장, 또는 과장된 답에서 탈락 신호가 보여요. 아래 1번부터 고쳐 보세요.';}
  else if(fit>=90&&below.length<=1){verdict='CJ와 잘 맞아요';vCls='good';vSum=below.length?`6개 항목 중 ${belowTxt}만 기준선보다 조금 낮고, 함정에도 거의 안 걸렸어요. 실전에서도 지금처럼 답하면 돼요.`:'6개 항목 모두 기준선을 넘었고 함정에도 거의 안 걸렸어요. 실전에서도 지금처럼 답하면 돼요.';}
  else if(fit>=78){verdict='조금만 다듬으면 돼요';vCls='mid';vSum=`큰 방향은 CJ와 맞아요. 다만 ${belowTxt||'일부 항목'}이 기준선보다 낮아요. 아래 고칠 점부터 보세요.`;}
  else{verdict='아직 거리가 있어요';vCls='bad';vSum=`${belowTxt}이 기준선보다 안쪽에 있어요. 아래 고칠 점을 순서대로 보세요.`;}
  // 속도
  const per=S.pageTimes.map(x=>x.sec/x.n);
  const avgPer=S.p1.length?(S.p1End-S.p1Start)/1000/Math.max(answered,1):0;
  const fastPages=per.filter(x=>x<4).length;
  // 엇갈린 성향
  const sorted=Object.keys(TR).filter(t=>score[t]!=null).sort((a,b)=>score[b]-score[a]);
  const top=new Set(sorted.slice(0,4)),bot=new Set(sorted.slice(-4));
  const mism=S.mode==='full'?Object.keys(TR).filter(t=>(top.has(t)&&net[t]<=-2)||(bot.has(t)&&net[t]>=2)):[];
  return {score,dist,answered,un1:S.p1.length-answered,cons,shaky,pd,tcons,maxStreak,traps,oc,ocN,ocR,lie,lieCls,net,app,p2un,negHon,trapPick,trapAvoid,vh,va,val,valCls,spread,strong,sharp,sharpCls,axes,fit,verdict,vCls,vSum,per,avgPer,fastPages,mism};
}

    L.push({sev:R.cons<75?3:2,title:'같은 성향에 대한 답이 엇갈렸어요',data:`일관성 ${R.cons}%${w.length?`, 흔들린 영역: ${w.join(', ')}`:''}`,why:'응답이 엇갈리면 결과 자체를 믿기 어려워서 해석 전에 걸러질 수 있어요.',how:'흔들린 영역마다 기준 문장 하나를 정해 두고, 반대 방향 문장은 부정어에서 한 번 멈추세요.'});}
  if(R.traps.MAL.hits.length>=2)L.push({sev:R.traps.MAL.hits.length>=4?3:2,title:'적응 척도 문장에 그렇다 이상으로 답했어요',data:`${R.traps.MAL.hits.length}개`,why:'피해의식, 충동, 공격성, 지나친 불안을 거르는 문장이에요. 여러 개가 겹치면 조직 적응에 대한 우려로 읽힐 수 있어요.',how:'그날 기분이 아니라 평소 모습으로 답하세요. 실제로 해당하지 않는다면 아니다로 분명히 하면 돼요.'});

function hexSVG(axes){
  const cx=180,cy=174,R=112;
  const pt=(i,v)=>{const a=(-90+i*60)*Math.PI/180;return [cx+R*v/100*Math.cos(a),cy+R*v/100*Math.sin(a)];};
  const poly=vs=>vs.map((v,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
  let g='';
  [20,40,60,80,100].forEach(r=>{g+=`<polygon class="ring" points="${poly(axes.map(()=>r))}"/>`;});
  axes.forEach((a,i)=>{const [x,y]=pt(i,100);g+=`<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;});
  g+=`<polygon class="target" points="${poly(axes.map(a=>a.target))}"/>`;
  g+=`<polygon class="me" points="${poly(axes.map(a=>a.v))}"/>`;
  axes.forEach((a,i)=>{const [x,y]=pt(i,a.v);g+=`<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`;});
  axes.forEach((a,i)=>{const [x,y]=pt(i,128);const anchor=Math.abs(x-cx)<5?'middle':(x>cx?'start':'end');const dy=i===0?-16:(i===3?6:0);
    g+=`<text class="lab" x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}">${a.n}</text><text class="val${a.v<a.target?' low':''}" x="${x.toFixed(1)}" y="${(y+dy+16).toFixed(1)}" text-anchor="${anchor}">${a.v} / ${a.target}</text>`;});
  return `<svg viewBox="0 0 360 352" role="img" aria-label="CJ 인재상 6축 그래프: ${axes.map(a=>a.n+' '+a.v+'점').join(', ')}">${g}</svg>`;
}
function meter(label,val,target,txt,cls){
  const col=cls==='good'?'var(--ok)':cls==='mid'?'var(--warn)':'var(--omr)';
  return `<div class="meter"><span>${label}</span><span class="mt"><i style="width:${clamp(val,0,100)}%;background:${col}"></i><b style="left:${target}%"></b></span><span class="mv" style="color:${col}">${txt}</span></div>`;
}
function scale5(v,zone){
  const inZ=zone?(v>=zone[0]&&v<=zone[1]):true;
  const cells=[1,2,3,4,5].map(n=>{let cl=[];if(zone&&n>=zone[0]&&n<=zone[1])cl.push('z');if(n===v)cl.push(inZ?'me':'off');return `<span class="${cl.join(' ')}"><b>${n}</b><small>${SCALE[n-1]}</small></span>`;}).join('');
  return `<div class="sc5" role="img" aria-label="내 답 ${SCALE[v-1]}${zone?`, 일관된 범위 ${SCALE[zone[0]-1]}부터 ${SCALE[zone[1]-1]}`:''}">${cells}</div>`;
}
function speedSVG(per){
  if(!per.length)return '';
  const W=600,H=150,pad=22,bw=(W-pad*2)/per.length;const max=Math.max(12,...per);
  const y=v=>H-18-(v/max)*(H-40);
  let bars=per.map((v,i)=>`<rect class="sb${v<4?' fast':''}" x="${(pad+i*bw+bw*0.15).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${(H-18-y(v)).toFixed(1)}" rx="1"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="페이지별 문항당 풀이 시간">${bars}<line class="tl" x1="${pad}" x2="${W-pad}" y1="${y(6).toFixed(1)}" y2="${y(6).toFixed(1)}"/><text class="ax" x="${pad}" y="12">문항당 초 (점선: 권장 6초)</text><text class="ax" x="${pad}" y="${H-4}">1페이지</text><text class="ax" x="${W-pad}" y="${H-4}" text-anchor="end">${per.length}페이지</text></svg>`;
}
const TYPE_WHY={
  ABS:(it,v,lo,hi)=>"예외를 인정하지 않는 절대 표현이라 사실상 아무도 해당하지 않는 문장이에요. 그렇다 이상이면 과장으로 읽혀요.",

  ABI:(it,v,lo,hi)=>hi===3?"사람을 이용하는 뉘앙스가 있는 문장이라 그렇다 이상이면 계산적인 사람으로 읽힐 수 있어요.":"능력을 묻는 문장이지만 매우 그렇다는 사람을 이용하는 정치적인 성향으로 읽힐 수 있어요."

function rangeLabel(lo,hi){return lo===hi?SCALE[lo-1]:`${SCALE[lo-1]}~${SCALE[hi-1]}`;}
function hitBlock(k,it,isAmb){
  const v=S.a1[it.id];const [lo,hi]=it.safe||TYPES[k].safe;
  const why=k==='VAL'?(it.why||"그럴듯하게 들리지만 CJ 가치와 부딪히는 생각이에요."):TYPE_WHY[k](it,v,lo,hi);

function trapCard(k,R){

    if(level!=='ok')review.push({set,si,m,l,notes,level});

  <section class="sheet block"><h2>함정 문장 점검</h2>
    <p class="sec-lead">함정 문장은 일곱 종류예요. 종류마다 초록 칸이 안전한 답이에요. 칸 아래 숫자는 내가 그 번호를 고른 횟수이고, 빨간 숫자는 함정에 걸린 답이에요.</p>
    <div class="tgrid">${TYPE_ORDER.map(k=>trapCard(k,R)).join('')}</div>

let DL=null,DLSTATE='pending';
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){DL=await window.claude.use('downloads');}else{DL={save:async({filename,data})=>{window.__pdf.save(filename);return {status:'saved'};},native:true};}}catch(e){DL=null;}
  DLSTATE=DL?'ready':'none';
  if(S.phase==='result'){const b=document.querySelector('[data-act="pdf"]');const m=document.getElementById('pdfmsg');if(b)b.disabled=!DL;if(m&&!DL)m.textContent='이 화면에서는 파일 저장을 쓸 수 없어요.';}
})();
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return;}const s=document.createElement('script');s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
async function savePDF(btn){
  const msg=document.getElementById('pdfmsg');
  if(!DL){if(msg)msg.textContent='이 화면에서는 파일 저장을 쓸 수 없어요.';return;}
  const label=btn.textContent;btn.disabled=true;btn.textContent='PDF 만드는 중…';if(msg)msg.textContent='';
  const html=document.documentElement;const prevTheme=html.getAttribute('data-theme');html.setAttribute('data-theme','light');
  const root=document.getElementById('report');const closed=[...root.querySelectorAll('details')].filter(d=>!d.open);closed.forEach(d=>d.open=true);
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    let cuts=[],rootH=1;
    const canvas=await window.html2canvas(root,{scale:2,backgroundColor:'#EDF0F4',windowWidth:1000,
      ignoreElements:el=>el.classList&&el.classList.contains('no-pdf'),
      onclone:doc=>{const r=doc.getElementById('report');const rt=r.getBoundingClientRect().top;rootH=r.scrollHeight;
        cuts=[...r.children].filter(ch=>!ch.classList.contains('no-pdf')).map(ch=>ch.getBoundingClientRect().bottom-rt+6);}});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const margin=10,iw=210-margin*2,ihMax=297-margin*2;const pxPerMm=canvas.width/iw;const pageH=Math.floor(ihMax*pxPerMm);
    const k=canvas.height/rootH;const cutPx=cuts.map(x=>Math.round(x*k)).filter(x=>x>0&&x<canvas.height);
    let y=0,first=true;
    while(y<canvas.height-4){
      let end=Math.min(y+pageH,canvas.height);
      if(end<canvas.height){const ok=cutPx.filter(cp=>cp>y+pageH*0.35&&cp<=y+pageH);if(ok.length)end=Math.max(...ok);}
      const h=end-y;const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
      const ctx=c.getContext('2d');ctx.fillStyle='#EDF0F4';ctx.fillRect(0,0,c.width,h);ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      if(!first)pdf.addPage();pdf.setFillColor(237,240,244);pdf.rect(0,0,210,297,'F');
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',margin,margin,iw,h/pxPerMm);first=false;y=end;
    }
    window.__pdf=pdf;const blob=pdf.output('blob');
    await DL.save({filename:`CJ_CFT_연습결과_${S.fileDate||'report'}.pdf`,data:blob});
    if(msg)msg.textContent='PDF를 저장했어요.';
  }catch(e){
    if(msg)msg.textContent=(e&&e.code==='declined')?'':(e&&e.message==='load')?'PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.':'PDF를 만들지 못했어요. 잠시 후 다시 시도해 주세요.';
  }finally{
    closed.forEach(d=>d.open=false);if(prevTheme==null)html.removeAttribute('data-theme');else html.setAttribute('data-theme',prevTheme);
    btn.disabled=false;btn.textContent=label;
  }
}

function goPhase(p){S.phase=p;S.quitArmed=false;render();}
function finishP1(timeout){clearInterval(S.timer);S.p1End=Date.now();S.p1Timeout=!!timeout;
  if(S.pageStart){const c=CFG[S.mode];const page=S.p1.slice(S.page*c.per,S.page*c.per+c.per);const n=page.filter(it=>S.a1[it.id]!=null).length;if(n)S.pageTimes.push({sec:(Date.now()-S.pageStart)/1000,n});}
  goPhase('guide2');}
function finishP2(timeout){
  clearInterval(S.timer);S.p2End=Date.now();S.p2Timeout=!!timeout;S.R=analyze();
  const d=new Date();S.dateLabel=`${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  S.fileDate=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
  saveHist({d:S.dateLabel,mode:CFG[S.mode].name,fit:S.R.fit,verdict:S.R.verdict,cons:S.R.cons,lie:S.R.lie,val:S.R.val,p1:fmtDur(S.p1End-S.p1Start)});
  goPhase('result');
}
function refreshP1(){const y=window.scrollY;app.innerHTML=p1();const el=document.getElementById('timer');if(el)el.textContent=fmt(Math.ceil((S.deadline-Date.now())/1000));window.scrollTo(0,y);}
function refreshP2(){const y=window.scrollY;app.innerHTML=p2();const el=document.getElementById('timer');if(el)el.textContent=fmt(Math.ceil((S.deadline-Date.now())/1000));window.scrollTo(0,y);}
function nextP1(){const c=CFG[S.mode];const total=Math.ceil(S.p1.length/c.per);const page=S.p1.slice(S.page*c.per,S.page*c.per+c.per);
  if(!page.every(it=>S.a1[it.id]!=null))return;
  if(S.page>=total-1){finishP1(false);return;}
  S.pageTimes.push({sec:(Date.now()-S.pageStart)/1000,n:page.length});S.pageStart=Date.now();
  S.page++;S.quitArmed=false;refreshP1();window.scrollTo(0,0);}
function nextP2(){const set=S.p2[S.setIdx];const a=S.a2[set.id]||{};if(a.m==null||a.l==null)return;
  if(S.setIdx>=S.p2.length-1){finishP2(false);return;}S.setIdx++;S.quitArmed=false;refreshP2();window.scrollTo(0,0);}
function answerP1(id,v){S.a1[id]=v;refreshP1();const nx=curItemId();if(nx!=null){const el=document.getElementById('q'+nx);if(el){const r=el.getBoundingClientRect();if(r.bottom>window.innerHeight-20)el.scrollIntoView({block:'center'});}}}

app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){S.mode=b.dataset.mode;render();return;}
  if(b.dataset.q!=null){answerP1(+b.dataset.q,+b.dataset.v);return;}
  if(b.dataset.set!=null){const id=+b.dataset.set,k=b.dataset.k,i=+b.dataset.i;const a=S.a2[id]=S.a2[id]||{};a[k]=i;const o=k==='m'?'l':'m';if(a[o]===i)a[o]=null;refreshP2();return;}
  const act=b.dataset.act;
  if(act==='pdf'){savePDF(b);return;}
  if(act==='start'||act==='again'){startPrep();return;}
  if(act==='skipgen'){b.disabled=true;b.textContent='기본 문항으로 준비하는 중…';try{S.genCtl.abort();}catch(e){}return;}
  else if(act==='home'){clearInterval(S.timer);goPhase('intro');}
  else if(act==='go1'){S.p1Start=Date.now();S.pageStart=Date.now();S.phase='p1';render();startTimer(CFG[S.mode].p1t,CFG[S.mode].low1,finishP1);}
  else if(act==='go2'){S.p2Start=Date.now();S.phase='p2';render();startTimer(CFG[S.mode].p2t,CFG[S.mode].low2,finishP2);}
  else if(act==='next1')nextP1();
  else if(act==='next2')nextP2();
  else if(act==='quit'){
    if(S.quitArmed){clearInterval(S.timer);goPhase('intro');}
    else{S.quitArmed=true;b.classList.add('armed');b.textContent='한 번 더 누르면 종료';clearTimeout(S.qt);S.qt=setTimeout(()=>{S.quitArmed=false;const q=document.querySelector('.quit');if(q){q.classList.remove('armed');q.textContent='그만두기';}},3000);}
  }
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.phase==='p1'){if(/^[1-5]$/.test(e.key)){const id=curItemId();if(id!=null){e.preventDefault();answerP1(id,+e.key);}}else if(e.key==='Enter'){e.preventDefault();nextP1();}}
  else if(S.phase==='p2'&&e.key==='Enter'){e.preventDefault();nextP2();}
});
window.addEventListener('beforeunload',e=>{if(S.phase==='p1'||S.phase==='p2'){e.preventDefault();e.returnValue='';}});
render();
</script>
</body>
